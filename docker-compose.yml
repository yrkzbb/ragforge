services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: ragforge, POSTGRES_PASSWORD: ragforge, POSTGRES_DB: ragforge}
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/migrations:/docker-entrypoint-initdb.d:ro"]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ragforge"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: ./backend
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge, REDIS_URL: redis://redis:6379/0, OTLP_ENDPOINT: http://otel-collector:4317, HF_HOME: /models/huggingface, FASTEMBED_CACHE_PATH: /models/fastembed}
    volumes: ["modelcache:/models"]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge, REDIS_URL: redis://redis:6379/0, OTLP_ENDPOINT: http://otel-collector:4317}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317"]
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4318:4318"]
volumes: {pgdata: {}, redisdata: {}, modelcache: {}}
