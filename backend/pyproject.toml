[project]
name = "ragforge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0", "pgvector==0.4.1", "pydantic-settings==2.10.1",
  "redis==6.4.0", "celery==5.5.3", "httpx==0.28.1", "python-multipart==0.0.20",
  "pypdf==6.0.0", "rank-bm25==0.2.2", "numpy==2.3.2", "openai==1.101.0",
  "opentelemetry-api==1.36.0", "opentelemetry-sdk==1.36.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.36.0", "opentelemetry-instrumentation-fastapi==0.57b0",
  "prometheus-client==0.22.1", "tenacity==9.1.2"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
