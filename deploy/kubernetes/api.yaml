apiVersion: apps/v1
kind: Deployment
metadata: {name: ragforge-api, namespace: ragforge}
spec:
  replicas: 2
  selector: {matchLabels: {app: ragforge-api}}
  template:
    metadata: {labels: {app: ragforge-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ghcr.io/REPLACE_OWNER/ragforge:REPLACE_TAG
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: ragforge-config}
            - secretRef: {name: ragforge-secrets}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 6Gi}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: model-cache, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: ragforge-model-cache}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: ragforge-api, namespace: ragforge}
spec:
  selector: {app: ragforge-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ragforge-model-cache, namespace: ragforge}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 3Gi}}
