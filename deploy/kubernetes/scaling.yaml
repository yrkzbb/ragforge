apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ragforge-api, namespace: ragforge}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ragforge-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ragforge-api, namespace: ragforge}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: ragforge-api}}
